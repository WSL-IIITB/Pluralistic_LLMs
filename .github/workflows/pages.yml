# Publishes the dashboard to GitHub Pages as a static site: the finished study (district research,
# personas, the default analysis run) is baked into public/data/, so no backend is needed.
# To refresh the data: run the backend, `python3 scripts/export_static_data.py`, commit public/data/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [karnataka-regions]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
