# Publishes the dashboard to GitHub Pages as a static site: the finished study (district research,
# personas, the default analysis run) is baked into public/data/, so no backend is needed.
# To refresh the data: run the backend, `python3 scripts/export_static_data.py`, commit public/data/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [karnataka-regions, human-eval-form, findings-chat, light-theme-persona-map-factor-research]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Build and deploy are separate jobs (GitHub's own Pages layout): in one job, deploy-pages looked for the
# uploaded artifact ~2 s after upload, before GitHub had registered it, and failed with "No artifacts named
# github-pages were found". A second job only starts once the upload is complete and visible.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # Public address of the chat Worker (set with `gh variable set CHAT_URL`); empty = chat shows "not connected".
          VITE_CHAT_URL: ${{ vars.CHAT_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
